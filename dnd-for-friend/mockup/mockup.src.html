<title>DnD for friend · Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Almendra+SC&family=Mitr:wght@400;500&family=Sarabun:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 16:9 game stage per screen. Scene art fills it; HUD floats on top (party top-left, menu top-right,
   hint strip top-center, story caption or combat hotbar at the bottom). Candle-lit tabletop: walnut, leather, parchment, candle gold. */
:root {
  --walnut: #140f0b; --leather: #261b13; --leather-2: #33261b; --edge: #5a4330;
  --parchment: #efe3c8; --ink: #2a1d12; --muted: #b9a687; --candle: #e9b44c; --ember: #d0603f; --verdigris: #63b09c; --hp: #6fbf6a;
  --f-name: "Almendra", "Mitr", Georgia, serif; --f-sc: "Almendra SC", "Mitr", Georgia, serif;
  --f-th: "Mitr", "Sarabun", system-ui, sans-serif; --f-body: "Sarabun", "Mitr", system-ui, sans-serif; --f-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { background: radial-gradient(1200px 600px at 50% 0%, #2a1d13 0%, var(--walnut) 70%); background-color: var(--walnut); color: var(--parchment); font: 16px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; min-height: 100% }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
header.top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { margin: 0; font: 700 2rem/1 var(--f-name); letter-spacing: .01em }
h1 small { font: 500 .8rem var(--f-th); color: var(--muted); letter-spacing: 0; margin-left: 8px }
.note { color: var(--muted); font-size: .92rem; max-width: 70ch; margin: 0 }
.tabs { display: flex; gap: 6px; flex-wrap: wrap }
.tabs button { font: 500 .95rem var(--f-th); color: var(--muted); background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--candle); color: var(--ink); border-color: var(--candle) }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px }

/* ---------- stage ---------- */
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: #0b0805;
  box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(0,0,0,.6), inset 0 0 120px rgba(0,0,0,.6) }
.stage canvas.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%) }
.hud { position: absolute; inset: 0; pointer-events: none }
.hud > * { pointer-events: auto }

.plate { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none }
.plate .loc { font: 700 clamp(1rem, 2.2vw, 1.6rem)/1 var(--f-name); text-shadow: 0 2px 8px #000 }
.plate .th { font: 400 clamp(.7rem, 1.2vw, .85rem) var(--f-th); color: var(--muted); text-shadow: 0 1px 4px #000 }

.hint { position: absolute; top: clamp(52px, 8vw, 70px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  background: rgba(20,15,11,.82); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 14px 5px 6px; font: 400 clamp(.72rem, 1.3vw, .9rem) var(--f-th); white-space: nowrap; backdrop-filter: blur(4px) }
.mode { font: 500 .78em var(--f-th); padding: 2px 10px; border-radius: 999px; background: var(--verdigris); color: #0d1a16 }
.mode.fight { background: var(--ember); color: #fff }
.mode.town { background: var(--candle); color: var(--ink) }

.party { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px }
.pc { display: flex; align-items: center; gap: 8px; background: rgba(20,15,11,.78); border: 1px solid var(--edge); border-radius: 999px; padding: 3px 12px 3px 3px; font-size: .78rem }
.pc .face { width: clamp(30px, 4vw, 42px); aspect-ratio: 1; border-radius: 50%; background: var(--leather-2) center/cover; border: 2px solid var(--verdigris); display: grid; place-items: center; font: 600 .8rem var(--f-th) }
.pc b { font: 700 .9rem var(--f-name); display: block; line-height: 1.1 }
.bar { height: 5px; width: 74px; background: #000; border-radius: 3px; overflow: hidden; margin-top: 3px }
.bar i { display: block; height: 100%; background: var(--hp) }
.pc.now { border-color: var(--candle); box-shadow: 0 0 0 1px var(--candle), 0 0 18px rgba(233,180,76,.35) }

.menu { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px }
.ic { width: clamp(32px, 4vw, 40px); aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--edge); background: rgba(20,15,11,.8); color: var(--parchment); display: grid; place-items: center; cursor: pointer; padding: 0 }
.ic svg { width: 55%; height: 55% }
.ic[aria-pressed="true"] { background: var(--candle); color: var(--ink) }

/* story caption (visual novel) */
.caption { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92%, 860px); display: flex; flex-direction: column; gap: 8px }
.speech { background: linear-gradient(180deg, rgba(239,227,200,.97), rgba(226,210,176,.97)); color: var(--ink); border-radius: 12px; padding: 14px 18px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); position: relative }
.speech .who { position: absolute; top: -14px; left: 16px; background: var(--leather); color: var(--candle); border: 1px solid var(--edge); font: 700 .85rem var(--f-sc); padding: 2px 12px; border-radius: 6px; letter-spacing: .04em }
.speech p { margin: 0; font: 400 clamp(.82rem, 1.5vw, 1.02rem)/1.65 var(--f-body); max-width: 72ch }
.choices { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
.choice { font: 500 clamp(.74rem, 1.3vw, .88rem) var(--f-th); background: rgba(20,15,11,.88); color: var(--parchment); border: 1px solid var(--candle); border-radius: 999px; padding: 6px 14px; cursor: pointer }
.choice:hover { background: var(--candle); color: var(--ink) }
.choice .tag { font: 600 .8em var(--f-num); color: var(--verdigris); margin-left: 6px }
.say { display: flex; gap: 6px }
.say input { flex: 1; min-width: 0; background: rgba(20,15,11,.88); border: 1px solid var(--edge); color: var(--parchment); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: .85rem }

/* town hotspots */
.spot { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; color: var(--parchment); cursor: pointer; padding: 0 }
.spot .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--candle); box-shadow: 0 0 0 4px rgba(233,180,76,.25), 0 0 18px var(--candle); animation: glow 2.4s ease-in-out infinite }
.spot .lbl { background: rgba(20,15,11,.85); border: 1px solid var(--edge); border-radius: 8px; padding: 3px 10px; text-align: center; transition: transform .15s, border-color .15s }
.spot .lbl b { display: block; font: 700 clamp(.72rem, 1.3vw, .95rem)/1.1 var(--f-name) }
.spot .lbl span { font: 400 clamp(.62rem, 1vw, .74rem) var(--f-th); color: var(--muted) }
.spot:hover .lbl, .spot:focus-visible .lbl { transform: translateY(-3px); border-color: var(--candle) }
@keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(233,180,76,.12), 0 0 26px var(--candle) } }

/* interior panel */
.room { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); background: rgba(10,7,5,.55); backdrop-filter: blur(2px) }
.room .npc { position: relative; display: flex; align-items: end; justify-content: center }
.room .npc canvas { width: 82%; max-width: 360px; aspect-ratio: 3 / 4; height: auto }
.room .side { align-self: center; margin-right: 4%; display: flex; flex-direction: column; gap: 10px }
.room h2 { margin: 0; font: 700 clamp(1.1rem, 2.4vw, 1.8rem)/1 var(--f-name) }
.room .acts { display: flex; flex-wrap: wrap; gap: 8px }
.btn { font: 500 clamp(.78rem, 1.3vw, .92rem) var(--f-th); border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--edge); background: var(--leather-2); color: var(--parchment); display: inline-flex; gap: 8px; align-items: center }
.btn.gold { background: var(--candle); color: var(--ink); border-color: var(--candle) }
.btn small { font-family: var(--f-num); opacity: .8 }

/* combat HUD */
.order { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center }
.order .o { width: clamp(30px, 3.6vw, 40px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: 600 .72rem var(--f-th); border: 2px solid var(--verdigris); background: var(--leather-2) center/cover; position: relative }
.order .o.foe { border-color: var(--ember) }
.order .o.now { transform: scale(1.22); box-shadow: 0 0 0 2px var(--candle), 0 0 16px var(--candle) }
.order .o em { position: absolute; bottom: -14px; font: 600 .62rem var(--f-num); font-style: normal; color: var(--muted) }
.banner { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font: 700 clamp(1.4rem, 4vw, 3rem)/1 var(--f-name); color: var(--candle); text-shadow: 0 4px 20px #000; pointer-events: none; opacity: 0 }
.banner.show { animation: banner 1.6s ease both }
@keyframes banner { 0% { opacity: 0; letter-spacing: .3em } 20%, 75% { opacity: 1; letter-spacing: .04em } 100% { opacity: 0 } }

.me { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: end; gap: 10px }
.me .big { width: clamp(64px, 9vw, 104px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--candle); background: var(--leather-2) center/cover; box-shadow: 0 0 24px rgba(233,180,76,.3) }
.me .stats { background: rgba(20,15,11,.85); border: 1px solid var(--edge); border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; font-size: .74rem }
.me .stats b { font: 700 .95rem var(--f-name) }
.me .hpbar { height: 8px; width: clamp(90px, 12vw, 150px); background: #000; border-radius: 4px; overflow: hidden }
.me .hpbar i { display: block; height: 100%; background: var(--hp); transition: width .4s }
.pips { display: flex; gap: 4px; align-items: center; font-family: var(--f-num) }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--candle) }
.pip.on { background: var(--candle) }
.econ { display: flex; gap: 4px }
.econ span { font: 500 .66rem var(--f-th); padding: 1px 6px; border-radius: 999px; background: var(--verdigris); color: #0d1a16 }
.econ span.used { background: #3a2f25; color: var(--muted); text-decoration: line-through }

.hotbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: clamp(4px, .8vw, 8px); background: rgba(20,15,11,.86); border: 1px solid var(--edge); border-radius: 16px; padding: 8px }
.slot { width: clamp(42px, 5.6vw, 64px); aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--edge); background: linear-gradient(180deg, var(--leather-2), var(--leather)); color: var(--parchment); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; position: relative; padding: 0 }
.slot svg { width: 46%; height: 46% }
.slot span { font: 500 clamp(.52rem, .9vw, .66rem) var(--f-th) }
.slot kbd { position: absolute; top: 3px; left: 5px; font: 600 .56rem var(--f-num); color: var(--muted) }
.slot[aria-pressed="true"] { border-color: var(--candle); box-shadow: 0 0 0 1px var(--candle), 0 0 16px rgba(233,180,76,.4); color: var(--candle) }
.slot.end { background: var(--ember); border-color: var(--ember) }
.slot:disabled { opacity: .35; cursor: default }
.step { position: absolute; left: 50%; bottom: clamp(70px, 9.4vw, 96px); transform: translateX(-50%); background: var(--candle); color: var(--ink); font: 500 clamp(.72rem, 1.3vw, .9rem) var(--f-th); padding: 4px 14px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.5) }

/* dice */
.dice { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,6,4,.55); pointer-events: none; opacity: 0; transition: opacity .2s }
.dice.show { opacity: 1 }
.dcard { display: flex; flex-direction: column; align-items: center; gap: 10px }
.d20 { width: clamp(96px, 14vw, 150px); aspect-ratio: 1; position: relative; display: grid; place-items: center }
.d20 svg { position: absolute; inset: 0; width: 100%; height: 100% }
.d20 b { position: relative; font: 600 clamp(1.6rem, 4vw, 2.8rem) var(--f-num); color: var(--ink) }
.d20.roll { animation: tumble .9s cubic-bezier(.2,.7,.3,1) }
@keyframes tumble { 0% { transform: translateY(-60px) rotate(-200deg) scale(.6) } 70% { transform: translateY(6px) rotate(18deg) scale(1.05) } 100% { transform: none } }
.math { font: 600 clamp(.9rem, 2vw, 1.3rem) var(--f-num); background: rgba(20,15,11,.9); border: 1px solid var(--edge); padding: 6px 16px; border-radius: 10px; opacity: 0; transition: opacity .25s }
.verdict { font: 700 clamp(1.4rem, 3.6vw, 2.6rem)/1 var(--f-name); opacity: 0; transform: scale(1.6); transition: opacity .25s, transform .25s }
.dice.done .math, .dice.done .verdict { opacity: 1; transform: none }
.verdict.hit { color: var(--candle) } .verdict.miss { color: var(--muted) } .verdict.crit { color: var(--ember) }
.float { position: absolute; font: 700 clamp(1rem, 2.4vw, 1.8rem) var(--f-num); color: #ffdf8a; text-shadow: 0 2px 6px #000; pointer-events: none; animation: rise 1.3s ease-out forwards }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6) } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.2) } 100% { opacity: 0; transform: translate(-50%, -60px) } }

/* help coach marks */
.coach { position: absolute; inset: 0; background: rgba(5,4,3,.55); pointer-events: none }
.mark { position: absolute; display: flex; gap: 8px; align-items: flex-start; max-width: 230px; font: 400 clamp(.66rem, 1.15vw, .82rem)/1.45 var(--f-th); background: var(--parchment); color: var(--ink); border-radius: 10px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.6) }
.mark i { font: 600 .8rem var(--f-num); font-style: normal; background: var(--ember); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; flex: none }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.legend div { background: var(--leather); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; font-size: .9rem; color: var(--muted) }
.legend b { color: var(--parchment); font: 500 1rem var(--f-th); display: block; margin-bottom: 2px }

@media (max-width: 700px) {
  .party .pc div, .hint .txt { display: none }
  .room { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr) }
  .say { display: none }
  .me .stats { display: none }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>DnD for friend <small>ตัวอย่างหน้าจอแบบใหม่ (ลองกดได้)</small></h1>
      <p class="note">ภาพฉากตอนนี้เป็นภาพวาดชั่วคราวที่เกมวาดเอง ของจริงจะใช้ภาพจาก gen-images แทน กดปุ่ม ? มุมขวาบนเพื่อดูคำอธิบายแต่ละส่วน</p>
    </div>
    <nav class="tabs" aria-label="หน้าจอตัวอย่าง">
      <button id="t-town" aria-pressed="true">หมู่บ้าน</button>
      <button id="t-explore" aria-pressed="false">สำรวจ + DM</button>
      <button id="t-fight" aria-pressed="false">ต่อสู้</button>

    <div class="vignette"></div>

  </section>

  <div class="legend" id="legend"></div>
</div>

<script>
const FIZZ = "__FIZZ__";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } if (html) e.innerHTML = html; return e; };
const ICON = {
  sword: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14.5 3.5 20.5 3.5 20.5 9.5 9 21 3 15Z"/><path d="M6 12 12 18M4 20l2-2"/></svg>',
  spell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>',
  potion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 2h6M10 2v6L5 17a3 3 0 0 0 2.6 4.5h8.8A3 3 0 0 0 19 17l-5-9V2"/><path d="M7.5 14h9" /></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5Z"/></svg>',
  boots: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 2h5v11l6 3a2 2 0 0 1 1 1.7V21H4V2"/><path d="M4 17h15"/></svg>',
  run: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M6 11l3-3h5l3 4M11 15l2-6"/></svg>',
  end: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h12M13 6l6 6-6 6"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4ZM20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7Z"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>',
  voice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>',
  help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.4-1 1-1 1.7V14M12 18h.01"/></svg>',
};

// ---------- painted placeholder scenes (the real game swaps these for generated art) ----------
const cv = $("#scene"), ctx = cv.getContext("2d");
let W = 0, H = 0, view = "town", t0 = performance.now(), smoke = [];
function fit() { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
function house(x, y, w, h, roof, wall, lit, sign) {
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 4, w * .62, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = wall; ctx.fillRect(x, y, w, h);
  for (let i = 1; i < 4; i++) { ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(x, y + (h / 4) * i, w, 1.5); }
  ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(x - w * .12, y + 2); ctx.lineTo(x + w / 2, y - h * .62); ctx.lineTo(x + w * 1.12, y + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.beginPath(); ctx.moveTo(x + w / 2, y - h * .62); ctx.lineTo(x + w * 1.12, y + 2); ctx.lineTo(x + w * .6, y + 2); ctx.closePath(); ctx.fill();
  const win = (wx, wy) => { ctx.fillStyle = lit ? "#ffcf6e" : "#3b2a1c"; ctx.fillRect(wx, wy, w * .16, h * .22); if (lit) { ctx.fillStyle = "rgba(255,190,90,.18)"; ctx.beginPath(); ctx.arc(wx + w * .08, wy + h * .11, w * .22, 0, 7); ctx.fill(); } };
  win(x + w * .14, y + h * .25); win(x + w * .7, y + h * .25);
  ctx.fillStyle = "#2b1a10"; ctx.fillRect(x + w * .42, y + h * .5, w * .16, h * .5);
  if (sign) { ctx.fillStyle = "#6b4526"; ctx.fillRect(x + w * .98, y + h * .2, 3, h * .35); ctx.fillStyle = "#c8913f"; ctx.fillRect(x + w * .98, y + h * .3, w * .22, h * .16); }
